name: Cassette QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-qa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Release workflow tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Repository and release checks
        run: python3 scripts/verify_repository.py
      - name: Generated project is synchronized
        run: |
          python3 scripts/create_project.py
          git diff --exit-code -- OfflineMusicPlayer.xcodeproj
      - name: Native Catalyst regression tests
        run: |
          xcodebuild -project OfflineMusicPlayer.xcodeproj -scheme OfflineMusicPlayer \
            -configuration Release -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/Catalyst" \
            -resultBundlePath "$RUNNER_TEMP/NativeTests.xcresult" \
            ENABLE_TESTABILITY=YES ENABLE_HARDENED_RUNTIME=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test
      - name: Unsigned device build and static analysis
        run: |
          xcodebuild -project OfflineMusicPlayer.xcodeproj -scheme OfflineMusicPlayer \
            -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/Device" CODE_SIGNING_ALLOWED=NO build analyze
      - name: Package and validate IPA
        run: |
          TASK_APP="$RUNNER_TEMP/Device/Build/Products/Release-iphoneos/OfflineMusicPlayer.app"
          TASK_VERSION=$(python3 -c 'import plistlib, sys; print(plistlib.load(open(sys.argv[1], "rb"))["CFBundleShortVersionString"])' "$TASK_APP/Info.plist")
          TASK_IPA="dist/Cassette-unsigned-$TASK_VERSION.ipa"
          python3 scripts/package_ipa.py "$TASK_APP" "$TASK_IPA"
          python3 scripts/verify_repository.py --app "$TASK_APP" --ipa "$TASK_IPA"
          shasum -a 256 "$TASK_IPA" > dist/SHA256SUMS
      - name: Native Mac release package
        run: |
          xcodebuild -project OfflineMusicPlayer.xcodeproj -scheme OfflineMusicPlayer \
            -configuration Release -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/MacRelease" ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual ENABLE_HARDENED_RUNTIME=NO build
          TASK_APP="$RUNNER_TEMP/MacRelease/Build/Products/Release-maccatalyst/OfflineMusicPlayer.app"
          TASK_VERSION=$(python3 -c 'import plistlib, sys; print(plistlib.load(open(sys.argv[1], "rb"))["CFBundleShortVersionString"])' "$TASK_APP/Contents/Info.plist")
          TASK_MAC_APP="dist/Cassette.app"
          python3 scripts/package_mac.py "$TASK_APP" "$TASK_MAC_APP"
          python3 scripts/verify_repository.py --platform mac --app "$TASK_MAC_APP"
          shasum -a 256 "$TASK_MAC_APP/Contents/MacOS/OfflineMusicPlayer" >> dist/SHA256SUMS
      - name: Test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-test-results
          path: ${{ runner.temp }}/NativeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Unsigned packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Cassette-unsigned-${{ github.sha }}
          path: |
            dist/Cassette-unsigned-*.ipa
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
